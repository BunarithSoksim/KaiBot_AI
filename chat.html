<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with KaiBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rice-cream: #F7F2E7;
    --paddy-green: #33502E;
    --paddy-green-light: #4F7548;
    --rice-gold: #C79A2E;
    --clay-red: #B8452F;
    --ink: #2A2620;
    --ink-soft: #5C574C;
    --line: #E2D8C3;
    --bubble-bot: #FFFFFF;
    --bubble-user: #33502E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--rice-cream);
    color: var(--ink);
    font-family: 'Work Sans', 'Noto Sans Khmer', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .khmer { font-family: 'Noto Sans Khmer', 'Work Sans', sans-serif; }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--rice-cream);
  }
  header a.back {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
  }
  header a.back:hover { color: var(--paddy-green); }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--paddy-green);
  }
  .logo span { color: var(--rice-gold); }

  .sound-toggle {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    cursor: pointer;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease;
  }
  .sound-toggle:hover { border-color: var(--paddy-green); }
  .sound-toggle.muted { color: var(--ink-soft); }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .filter-chip {
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-chip.active {
    background: var(--paddy-green);
    border-color: var(--paddy-green);
    color: #fff;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    position: relative;
    max-width: 78%;
    padding: 14px 18px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 0.98rem;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    font-family: 'Noto Sans Khmer', sans-serif;
    padding-right: 46px; /* room for speaker button */
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.low-confidence {
    border-color: var(--rice-gold);
    background: #FFF8E8;
  }
  .msg .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .msg.typing {
    color: var(--ink-soft);
    font-style: italic;
  }

  .speaker-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--paddy-green);
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .speaker-btn:hover { background: rgba(51,80,46,0.08); }
  .speaker-btn.loading { opacity: 0.5; cursor: wait; }
  .speaker-btn.speaking {
    color: var(--clay-red);
    animation: speakerPulse 1s infinite;
  }
  @keyframes speakerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  .welcome {
    text-align: center;
    color: var(--ink-soft);
    margin: auto;
    max-width: 420px;
  }
  .welcome .khmer {
    color: var(--paddy-green);
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 18px 24px 26px;
    border-top: 1px solid var(--line);
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  button.mic-btn {
    padding: 14px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-size: 1.1rem;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button.mic-btn.recording {
    background: var(--clay-red);
    border-color: var(--clay-red);
    filter: brightness(1);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: 0.98rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--paddy-green); }
  button.send {
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    background: var(--clay-red);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.send:hover { filter: brightness(1.05); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back">&larr; KaiBot</a>
  <div class="logo">Kai<span>Bot</span></div>
  <button type="button" class="sound-toggle" id="sound-toggle" title="Sound on">🔊</button>
</header>

<div class="filters">
  <button class="filter-chip active" data-category="">All</button>
  <button class="filter-chip" data-category="crop">Crops</button>
  <button class="filter-chip" data-category="livestock">Livestock</button>
  <button class="filter-chip" data-category="market">Market</button>
</div>

<main id="messages">
  <div class="welcome" id="welcome">
    <div class="khmer">សួស្តី! សួរអ្វីមួយអំពីកសិកម្មរបស់អ្នក</div>
    <div>Ask a farming question below — crops, livestock, pests, or market prices.</div>
  </div>
</main>

<form id="chat-form">
  <input type="text" id="question-input" placeholder="វាយសំណួររបស់អ្នក..." autocomplete="off" />
  <button type="button" class="mic-btn" id="mic-btn" title="Voice input">🎤</button>
  <button type="submit" class="send" id="send-btn">Send</button>
</form>

<script>
  // Point this at your running FastAPI backend.
  const API_BASE = "http://127.0.0.1:8000";

  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  const sendBtn = document.getElementById('send-btn');
  const chips = document.querySelectorAll('.filter-chip');
  const soundToggle = document.getElementById('sound-toggle');

  let activeCategory = "";
  let soundEnabled = true;
  let currentAudio = null;

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
    });
  });

  // ---------- Sound toggle ----------
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
    soundToggle.title = soundEnabled ? 'Sound on' : 'Sound off';
    soundToggle.classList.toggle('muted', !soundEnabled);
    if (!soundEnabled && currentAudio) {
      currentAudio.pause();
    }
  });

  function stripMarkdown(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
  }

  // ---------- TTS playback ----------
  // ASSUMPTION: backend exposes POST /tts with JSON body {text: "..."}
  // and returns a raw audio blob (audio/mpeg or audio/wav). Adjust this
  // function to match your actual endpoint/field names if different.
  async function fetchTTSAudio(text) {
    const res = await fetch(`${API_BASE}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`TTS request failed: ${res.status}`);
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  async function playMessageAudio(text, speakerBtn) {
    if (!soundEnabled) return;

    try {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      document.querySelectorAll('.speaker-btn.speaking')
        .forEach(b => b.classList.remove('speaking'));

      speakerBtn.classList.add('loading');
      const audioUrl = await fetchTTSAudio(text);
      speakerBtn.classList.remove('loading');

      currentAudio = new Audio(audioUrl);
      speakerBtn.classList.add('speaking');

      currentAudio.addEventListener('ended', () => {
        speakerBtn.classList.remove('speaking');
      });
      currentAudio.addEventListener('error', () => {
        speakerBtn.classList.remove('speaking');
      });

      // If the browser blocks autoplay (no prior user interaction yet),
      // this silently fails and the farmer can just tap the speaker icon.
      await currentAudio.play().catch(() => {
        speakerBtn.classList.remove('speaking');
      });
    } catch (err) {
      speakerBtn.classList.remove('loading', 'speaking');
      console.error('TTS playback failed:', err);
    }
  }

  function addMessage(text, sender, opts = {}) {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = `msg ${sender}` + (opts.lowConfidence ? ' low-confidence' : '');

    const cleanText = stripMarkdown(text);
    const textSpan = document.createElement('span');
    textSpan.textContent = cleanText;
    div.appendChild(textSpan);

    // Only real bot answers get a speaker button -- typing indicators
    // ("bot typing") and connection errors ("bot low-confidence" literal
    // sender string) don't match sender === 'bot' exactly, so they're
    // automatically excluded.
    const isRealBotAnswer = sender === 'bot';
    let speakerBtn = null;
    if (isRealBotAnswer) {
      speakerBtn = document.createElement('button');
      speakerBtn.type = 'button';
      speakerBtn.className = 'speaker-btn';
      speakerBtn.title = 'Play / replay audio';
      speakerBtn.innerHTML = '🔊';
      speakerBtn.addEventListener('click', () => playMessageAudio(cleanText, speakerBtn));
      div.appendChild(speakerBtn);
    }

    if (opts.sources && opts.sources.length > 0) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.textContent = 'Sources: ' + opts.sources.join(', ');
      div.appendChild(src);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    // Auto-play as soon as the message appears.
    if (isRealBotAnswer && speakerBtn) {
      playMessageAudio(cleanText, speakerBtn);
    }

    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingMsg = addMessage('...', 'bot typing');

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          category: activeCategory || null,
        }),
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      addMessage(data.answer, 'bot', {
        lowConfidence: data.low_confidence,
        sources: data.sources,
      });
    } catch (err) {
      typingMsg.remove();
      addMessage(
        `Connection error — is the KaiBot backend running at ${API_BASE}? (${err.message})`,
        'bot low-confidence'
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  const micBtn = document.getElementById('mic-btn');
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
      audioChunks = [];

      mediaRecorder.addEventListener('dataavailable', (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      });

      mediaRecorder.addEventListener('stop', () => {
        stream.getTracks().forEach(track => track.stop());
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        sendVoiceMessage(audioBlob);
      });

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹';
    } catch (err) {
      addMessage(`Couldn't access microphone: ${err.message}`, 'bot low-confidence');
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
    }
  }

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  async function sendVoiceMessage(audioBlob) {
    const typingMsg = addMessage('...', 'bot typing');
    sendBtn.disabled = true;
    micBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');
      if (activeCategory) formData.append('category', activeCategory);

      const res = await fetch(`${API_BASE}/chat/voice`, {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      if (data.transcript) {
        addMessage(data.transcript, 'user');
      }
      addMessage(data.answer, 'bot', {
        lowConfidence: data.low_confidence,
        sources: data.sources,
      });
    } catch (err) {
      typingMsg.remove();
      addMessage(`Voice error — is the backend running? (${err.message})`, 'bot low-confidence');
    } finally {
      sendBtn.disabled = false;
      micBtn.disabled = false;
    }
  }
</script>

</body>
</html>
