<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with KaiBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rice-cream: #F7F2E7;
    --paddy-green: #33502E;
    --paddy-green-light: #4F7548;
    --rice-gold: #C79A2E;
    --clay-red: #B8452F;
    --ink: #2A2620;
    --ink-soft: #5C574C;
    --line: #E2D8C3;
    --bubble-bot: #FFFFFF;
    --bubble-user: #33502E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--rice-cream);
    color: var(--ink);
    font-family: 'Work Sans', 'Noto Sans Khmer', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .khmer { font-family: 'Noto Sans Khmer', 'Work Sans', sans-serif; }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--rice-cream);
  }
  header a.back {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
  }
  header a.back:hover { color: var(--paddy-green); }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--paddy-green);
  }
  .logo span { color: var(--rice-gold); }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .filter-chip {
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-chip.active {
    background: var(--paddy-green);
    border-color: var(--paddy-green);
    color: #fff;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 78%;
    padding: 14px 18px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 0.98rem;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    font-family: 'Noto Sans Khmer', sans-serif;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.low-confidence {
    border-color: var(--rice-gold);
    background: #FFF8E8;
  }
  .msg .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .msg.typing {
    color: var(--ink-soft);
    font-style: italic;
  }

  .welcome {
    text-align: center;
    color: var(--ink-soft);
    margin: auto;
    max-width: 420px;
  }
  .welcome .khmer {
    color: var(--paddy-green);
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 18px 24px 26px;
    border-top: 1px solid var(--line);
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: 0.98rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--paddy-green); }
  button.send {
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    background: var(--clay-red);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.send:hover { filter: brightness(1.05); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back">&larr; KaiBot</a>
  <div class="logo">Kai<span>Bot</span></div>
  <div style="width:60px"></div>
</header>

<div class="filters">
  <button class="filter-chip active" data-category="">All</button>
  <button class="filter-chip" data-category="crop">Crops</button>
  <button class="filter-chip" data-category="livestock">Livestock</button>
  <button class="filter-chip" data-category="market">Market</button>
</div>

<main id="messages">
  <div class="welcome" id="welcome">
    <div class="khmer">សួស្តី! សួរអ្វីមួយអំពីកសិកម្មរបស់អ្នក</div>
    <div>Ask a farming question below — crops, livestock, pests, or market prices.</div>
  </div>
</main>

<form id="chat-form">
  <input type="text" id="question-input" placeholder="វាយសំណួររបស់អ្នក..." autocomplete="off" />
  <button type="submit" class="send" id="send-btn">Send</button>
</form>

<script>
  // Point this at your running FastAPI backend.
  const API_BASE = "http://127.0.0.1:8000";

  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  const sendBtn = document.getElementById('send-btn');
  const chips = document.querySelectorAll('.filter-chip');

  let activeCategory = "";

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
    });
  });

  function stripMarkdown(text) {
  return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
}

  function addMessage(text, sender, opts = {}) {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = `msg ${sender}` + (opts.lowConfidence ? ' low-confidence' : '');
    div.textContent = stripMarkdown(text);

    if (opts.sources && opts.sources.length > 0) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.textContent = 'Sources: ' + opts.sources.join(', ');
      div.appendChild(src);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingMsg = addMessage('...', 'bot typing');

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          category: activeCategory || null,
        }),
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      addMessage(data.answer, 'bot', {
        lowConfidence: data.low_confidence,
        sources: data.sources,
      });
    } catch (err) {
      typingMsg.remove();
      addMessage(
        `Connection error — is the KaiBot backend running at ${API_BASE}? (${err.message})`,
        'bot low-confidence'
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
