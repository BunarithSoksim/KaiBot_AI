<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ជជែកជាមួយ KaiBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F2E7;
    --paddy: #33502E;
    --paddy-deep: #24371F;
    --gold: #C79A2E;      /* reserved: low-confidence marker only */
    --gold-bg: #FBF3DE;
    --clay: #B8452F;
    --clay-deep: #8C331F;
    --ink: #2A2620;
    --ink-soft: #5C574C;
    --ink-faint: #8A8272;
    --line: #E2D8C3;
    --bubble-bot: #FFFFFF;
    --bubble-user: #33502E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans Khmer', 'Work Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .khmer { font-family: 'Noto Sans Khmer', 'Work Sans', sans-serif; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--paddy); outline-offset: 2px; }

  /* ---------- Header — quiet, one wordmark, one toggle ---------- */
  header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--cream);
    flex-shrink: 0;
  }
  header a.back {
    color: var(--ink-soft);
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }
  header a.back:hover { color: var(--paddy); }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--paddy);
  }
  .logo span { color: var(--clay); }

  .sound-toggle {
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease;
  }
  .sound-toggle:hover { border-color: var(--paddy); }
  .sound-toggle.muted { color: var(--ink-faint); }
  .sound-toggle svg { width: 18px; height: 18px; }

  /* ---------- Category chips — plain outline, fill only when active ---------- */
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .filter-chip {
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: 0.82rem;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-chip.active {
    background: var(--paddy);
    border-color: var(--paddy);
    color: #fff;
  }

  /* ---------- Message thread ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    position: relative;
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 1rem;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
    font-family: 'Noto Sans Khmer', sans-serif;
    padding-right: 44px; /* room for speaker button */
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 3px;
    font-family: 'Noto Sans Khmer', sans-serif;
  }
  .msg.low-confidence {
    border-color: var(--gold);
    background: var(--gold-bg);
  }
  .msg.typing { color: var(--ink-faint); font-style: italic; padding-right: 18px; }

  .msg .sources,
  .msg .offline-note {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.76rem;
    color: var(--ink-faint);
  }
  .msg.low-confidence .sources,
  .msg.low-confidence .offline-note { border-top-color: #E9D6A3; }
  .msg .offline-note { font-style: italic; }

  .speaker-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--paddy);
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .speaker-btn:hover { background: rgba(51,80,46,0.08); }
  .speaker-btn.loading { opacity: 0.45; cursor: wait; }
  .speaker-btn.speaking { color: var(--clay); animation: speakerPulse 1s infinite; }
  .speaker-btn svg { width: 15px; height: 15px; }
  .offline-note { display: flex; align-items: flex-start; gap: 6px; }
  .offline-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; color: var(--ink-faint); }
  @keyframes speakerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- Empty state ---------- */
  .welcome {
    text-align: center;
    color: var(--ink-soft);
    margin: auto;
    max-width: 380px;
    padding: 40px 20px;
  }
  .welcome .khmer {
    color: var(--paddy);
    font-family: 'Noto Sans Khmer', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .welcome .sub { font-size: 0.85rem; color: var(--ink-faint); }

  /* ---------- Input row — mic is primary, send is quiet ---------- */
  form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 22px 24px;
    border-top: 1px solid var(--line);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    flex-shrink: 0;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: 0.98rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--paddy); }

  button.mic-btn {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 999px;
    border: none;
    background: var(--clay);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 var(--clay-deep);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.mic-btn svg { width: 21px; height: 21px; }

  button.cancel-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button.cancel-btn.visible { display: flex; }
  button.cancel-btn:hover { border-color: var(--clay); color: var(--clay); }
  button.cancel-btn svg { width: 16px; height: 16px; }
  button.mic-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--clay-deep); }
  button.mic-btn.recording {
    background: var(--clay-deep);
    box-shadow: 0 3px 0 #5f230f;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

  button.send {
    flex-shrink: 0;
    padding: 13px 22px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--paddy);
    font-family: 'Noto Sans Khmer', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button.send:hover { border-color: var(--paddy); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 480px) {
    button.send { padding: 13px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back" aria-label="ត្រឡប់ក្រោយ">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <div class="logo">Kai<span>Bot</span></div>
  <button type="button" class="sound-toggle" id="sound-toggle" title="បិទសំឡេង"></button>
</header>

<div class="filters">
  <button class="filter-chip active khmer" data-category="">ទាំងអស់</button>
  <button class="filter-chip khmer" data-category="crop">ដំណាំ</button>
  <button class="filter-chip khmer" data-category="livestock">សត្វចិញ្ចឹម</button>
  <button class="filter-chip khmer" data-category="market">ទីផ្សារ</button>
</div>

<main id="messages">
  <div class="welcome" id="welcome">
    <div class="khmer">សួស្តី! សួរអ្វីមួយអំពីកសិកម្មរបស់អ្នក</div>
    <div class="sub">សួរដោយសំឡេង ឬអក្សរ — ដំណាំ សត្វចិញ្ចឹម សត្វល្អិត ឬតម្លៃទីផ្សារ។</div>
  </div>
</main>

<form id="chat-form">
  <input type="text" id="question-input" placeholder="វាយសំណួររបស់អ្នក..." autocomplete="off" />
  <button type="button" class="cancel-btn" id="cancel-btn" title="បោះបង់ការថតសំឡេង" aria-label="បោះបង់ការថតសំឡេង">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button type="button" class="mic-btn" id="mic-btn" title="សួរដោយសំឡេង"></button>
  <button type="submit" class="send khmer" id="send-btn">ផ្ញើ</button>
</form>

<script>
  // Point this at your running FastAPI backend.
  const API_BASE = "http://127.0.0.1:8000";

  // ---------- Icon library (inline SVG, replaces emoji glyphs) ----------
  const ICON_VOLUME = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
  const ICON_MUTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
  const ICON_MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
  const ICON_STOP = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
  const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  const sendBtn = document.getElementById('send-btn');
  const chips = document.querySelectorAll('.filter-chip');
  const soundToggle = document.getElementById('sound-toggle');

  let activeCategory = "";
  let soundEnabled = true;
  let currentAudio = null;

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
    });
  });

  // ---------- Sound toggle ----------
  soundToggle.innerHTML = ICON_VOLUME; // initial state: sound on

  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.innerHTML = soundEnabled ? ICON_VOLUME : ICON_MUTE;
    soundToggle.title = soundEnabled ? 'បិទសំឡេង' : 'បើកសំឡេង';
    soundToggle.classList.toggle('muted', !soundEnabled);
    if (!soundEnabled && currentAudio) {
      currentAudio.pause();
    }
  });

  function stripMarkdown(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
  }

  // ---------- TTS playback ----------
  // ASSUMPTION: backend exposes POST /tts with JSON body {text: "..."}
  // and returns a raw audio blob (audio/mpeg or audio/wav). Adjust this
  // function to match your actual endpoint/field names if different.
  async function fetchTTSAudio(text) {
    const res = await fetch(`${API_BASE}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`TTS request failed: ${res.status}`);
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  async function playMessageAudio(text, speakerBtn) {
    if (!soundEnabled) return;

    try {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      document.querySelectorAll('.speaker-btn.speaking')
        .forEach(b => b.classList.remove('speaking'));

      speakerBtn.classList.add('loading');
      const audioUrl = await fetchTTSAudio(text);
      speakerBtn.classList.remove('loading');

      currentAudio = new Audio(audioUrl);
      speakerBtn.classList.add('speaking');

      currentAudio.addEventListener('ended', () => {
        speakerBtn.classList.remove('speaking');
      });
      currentAudio.addEventListener('error', () => {
        speakerBtn.classList.remove('speaking');
      });

      // If the browser blocks autoplay (no prior user interaction yet),
      // this silently fails and the farmer can just tap the speaker icon.
      await currentAudio.play().catch(() => {
        speakerBtn.classList.remove('speaking');
      });
    } catch (err) {
      speakerBtn.classList.remove('loading', 'speaking');
      console.error('TTS playback failed:', err);
    }
  }

  function addMessage(text, sender, opts = {}) {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = `msg ${sender}` + (opts.lowConfidence ? ' low-confidence' : '');

    const cleanText = stripMarkdown(text);
    const textSpan = document.createElement('span');
    textSpan.textContent = cleanText;
    div.appendChild(textSpan);

    // Only real bot answers get a speaker button -- typing indicators
    // ("bot typing") and connection errors ("bot low-confidence" literal
    // sender string) don't match sender === 'bot' exactly, so they're
    // automatically excluded.
    const isRealBotAnswer = sender === 'bot';
    let speakerBtn = null;
    if (isRealBotAnswer) {
      speakerBtn = document.createElement('button');
      speakerBtn.type = 'button';
      speakerBtn.className = 'speaker-btn';
      speakerBtn.title = 'ចាក់សំឡេង';
      speakerBtn.innerHTML = ICON_VOLUME;
      speakerBtn.addEventListener('click', () => playMessageAudio(cleanText, speakerBtn));
      div.appendChild(speakerBtn);
    }

    // Offline-cache answers (sources === ["(offline cache)"]) get a quiet,
    // Khmer, non-alarming note instead of a literal source citation --
    // matches the "calm connectivity indicator" requirement, not an error.
    const isOfflineCache = opts.sources && opts.sources.length === 1 && opts.sources[0] === '(offline cache)';
    if (isOfflineCache) {
      const note = document.createElement('div');
      note.className = 'offline-note';
      note.innerHTML = ICON_INFO + '<span>ចម្លើយពីព័ត៌មានរក្សាទុក (គ្មានអ៊ីនធឺណិត) — សូមផ្ទៀងផ្ទាត់ពេលមានអ៊ីនធឺណិតឡើងវិញ</span>';
      div.appendChild(note);
    } else if (opts.sources && opts.sources.length > 0) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.textContent = 'ប្រភព៖ ' + opts.sources.join(', ');
      div.appendChild(src);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    // Auto-play as soon as the message appears.
    if (isRealBotAnswer && speakerBtn) {
      playMessageAudio(cleanText, speakerBtn);
    }

    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingMsg = addMessage('...', 'bot typing');

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          category: activeCategory || null,
        }),
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      addMessage(data.answer, 'bot', {
        lowConfidence: data.low_confidence,
        sources: data.sources,
      });
    } catch (err) {
      typingMsg.remove();
      addMessage(
        `មិនអាចភ្ជាប់ទៅម៉ាស៊ីនមេបានទេ — តើ KaiBot backend កំពុងដំណើរការនៅ ${API_BASE} ដែរឬទេ? (${err.message})`,
        'bot low-confidence'
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  const micBtn = document.getElementById('mic-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  micBtn.innerHTML = ICON_MIC; // initial state: idle, ready to record
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let recordingCancelled = false;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
      audioChunks = [];

      mediaRecorder.addEventListener('dataavailable', (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      });

      mediaRecorder.addEventListener('stop', () => {
        stream.getTracks().forEach(track => track.stop());
        if (recordingCancelled) {
          recordingCancelled = false;
          return; // discarded -- farmer cancelled before we send anything
        }
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        sendVoiceMessage(audioBlob);
      });

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.innerHTML = ICON_STOP;
      micBtn.title = 'បញ្ឈប់ ហើយផ្ញើ';
      cancelBtn.classList.add('visible');
    } catch (err) {
      addMessage(`មិនអាចប្រើមីក្រូបានទេ: ${err.message}`, 'bot low-confidence');
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = ICON_MIC;
      micBtn.title = 'សួរដោយសំឡេង';
      cancelBtn.classList.remove('visible');
    }
  }

  cancelBtn.addEventListener('click', () => {
    if (isRecording) {
      recordingCancelled = true;
      stopRecording();
    }
  });

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  async function sendVoiceMessage(audioBlob) {
    const typingMsg = addMessage('...', 'bot typing');
    sendBtn.disabled = true;
    micBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');
      if (activeCategory) formData.append('category', activeCategory);

      const res = await fetch(`${API_BASE}/chat/voice`, {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      if (data.transcript) {
        addMessage(data.transcript, 'user');
      }
      addMessage(data.answer, 'bot', {
        lowConfidence: data.low_confidence,
        sources: data.sources,
      });
    } catch (err) {
      typingMsg.remove();
      addMessage(`បញ្ហាសំឡេង — តើ backend កំពុងដំណើរការដែរឬទេ? (${err.message})`, 'bot low-confidence');
    } finally {
      sendBtn.disabled = false;
      micBtn.disabled = false;
    }
  }

  async function playMessageAudio(text, speakerBtn) {
  if (!soundEnabled) return;

  // NEW: if this button is already playing, treat the click as "stop"
  if (speakerBtn.classList.contains('speaking')) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    speakerBtn.classList.remove('speaking');
    speakerBtn.innerHTML = ICON_VOLUME;
    return;
  }

  try {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    document.querySelectorAll('.speaker-btn.speaking')
      .forEach(b => {
        b.classList.remove('speaking');
        b.innerHTML = ICON_VOLUME;
      });

    speakerBtn.classList.add('loading');
    const audioUrl = await fetchTTSAudio(text);
    speakerBtn.classList.remove('loading');

    currentAudio = new Audio(audioUrl);
    speakerBtn.classList.add('speaking');
    speakerBtn.innerHTML = ICON_STOP; // NEW: swap icon so the affordance is visible

    currentAudio.addEventListener('ended', () => {
      speakerBtn.classList.remove('speaking');
      speakerBtn.innerHTML = ICON_VOLUME; // NEW
    });
    currentAudio.addEventListener('error', () => {
      speakerBtn.classList.remove('speaking');
      speakerBtn.innerHTML = ICON_VOLUME; // NEW
    });

    await currentAudio.play().catch(() => {
      speakerBtn.classList.remove('speaking');
      speakerBtn.innerHTML = ICON_VOLUME; // NEW
    });
  } catch (err) {
    speakerBtn.classList.remove('loading', 'speaking');
    speakerBtn.innerHTML = ICON_VOLUME; // NEW
    console.error('TTS playback failed:', err);
  }
}
</script>
