<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<script>
  // Applied before paint to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('smartkasekor-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ជជែកជាមួយ SmartKasekor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #081F14;
    --panel: #0F3320;
    --panel-2: #123A25;
    --line: #1F4A2C;
    --mid: #1E7A1A;
    --bright: #3FAE0F;
    --lime: #C3F53A;
    --ink-on-lime: #0E2410;
    --on-mid: #F3FAE6;
    --text: #EFF7E4;
    --text-soft: #A9C9AE;
    --text-faint: #6E8F76;
    --accent-text: #C3F53A;
    --heading-accent: #E3F9A6;
    --warn: #E8B93F;
    --warn-bg: #2B2610;
    --warn-line: #5C4A18;
  }

  :root[data-theme="light"] {
    --bg: #F4FAEA;
    --panel: #FFFFFF;
    --panel-2: #EDF6DC;
    --line: #CFE6AD;
    --mid: #2F8F1A;
    --bright: #2E8A0C;
    --text: #14241A;
    --text-soft: #3E5A45;
    --text-faint: #6C8874;
    --accent-text: #4C8A0C;
    --heading-accent: #2B5E12;
    --warn: #92660A;
    --warn-bg: #FBF1D6;
    --warn-line: #E3C878;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Khmer', 'Space Grotesk', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .khmer { font-family: 'Noto Sans Khmer', sans-serif; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    flex-shrink: 0;
    gap: 10px;
  }
  header a.back { color: var(--text-soft); text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 6px; }
  header a.back:hover { color: var(--lime); }

  .logo {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.02rem; color: var(--text);
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  .logo span { color: var(--accent-text); }

  .header-actions { display: flex; align-items: center; gap: 8px; }

  .lang-toggle {
    height: 38px; padding: 0 4px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); display: flex; align-items: center;
  }
  .lang-toggle button {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 500;
    padding: 6px 12px; border-radius: 999px; border: none; background: transparent;
    color: var(--text-faint); cursor: pointer; transition: all 0.15s ease;
  }
  .lang-toggle button.active { background: var(--lime); color: var(--ink-on-lime); }

  .icon-btn {
    width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-soft); transition: border-color 0.15s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--bright); }
  .icon-btn.muted { color: var(--text-faint); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Category chips ---------- */
  .filters {
    display: flex; gap: 8px; padding: 12px 22px; border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; flex-shrink: 0;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    font-family: 'Noto Sans Khmer', sans-serif; font-size: 0.82rem; padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--text-soft); cursor: pointer;
    transition: all 0.15s ease; flex-shrink: 0; white-space: nowrap;
  }
  .filter-chip.active { background: var(--mid); border-color: var(--mid); color: var(--on-mid); }

  /* ---------- Thread ---------- */
  main { flex: 1; overflow-y: auto; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; }

  .msg { position: relative; max-width: 80%; padding: 14px 18px; border-radius: 14px; line-height: 1.65; font-size: 1rem; white-space: pre-wrap; }
  .msg.bot {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
    border-bottom-left-radius: 3px; font-family: 'Noto Sans Khmer', sans-serif; padding-right: 44px; color: var(--text);
  }
  .msg.user {
    align-self: flex-end; background: var(--lime); color: var(--ink-on-lime);
    border-bottom-right-radius: 3px; font-family: 'Noto Sans Khmer', sans-serif; font-weight: 500;
  }
  .msg.low-confidence { border-color: var(--warn-line); background: var(--warn-bg); }
  .msg.typing { color: var(--text-faint); font-style: italic; padding-right: 18px; }

  .typing-dots { display: flex; gap: 5px; padding: 4px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: dotBounce 1.2s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotBounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .msg .sources, .msg .offline-note {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-faint);
  }
  .msg.low-confidence .sources, .msg.low-confidence .offline-note { border-top-color: var(--warn-line); color: var(--warn); }
  .msg .offline-note { font-style: italic; display: flex; align-items: flex-start; gap: 6px; }
  .offline-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }

  .speaker-btn {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
    border: none; background: transparent; color: var(--accent-text); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s ease;
  }
  .speaker-btn:hover { background: rgba(63,174,15,0.14); }
  .speaker-btn.loading { opacity: 0.45; cursor: wait; }
  .speaker-btn.speaking { color: var(--warn); animation: speakerPulse 1s infinite; }
  .speaker-btn svg { width: 15px; height: 15px; }
  @keyframes speakerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ---------- Empty state ---------- */
  .welcome { text-align: center; color: var(--text-soft); margin: auto; max-width: 380px; padding: 40px 20px; }
  .welcome .khmer { color: var(--heading-accent); font-family: 'Noto Sans Khmer', sans-serif; font-weight: 700; font-size: 1.2rem; line-height: 1.6; margin-bottom: 10px; }
  .welcome .sub { font-size: 0.85rem; color: var(--text-faint); }

  /* ---------- Input row ---------- */
  form { display: flex; align-items: center; gap: 10px; padding: 16px 22px 24px; border-top: 1px solid var(--line); max-width: 720px; width: 100%; margin: 0 auto; flex-shrink: 0; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 14px 18px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--panel); color: var(--text); font-family: 'Noto Sans Khmer', sans-serif; font-size: 1rem; outline: none;
  }
  input[type="text"]::placeholder { color: var(--text-faint); }
  input[type="text"]:focus { border-color: var(--bright); }

  button.mic-btn {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 999px; border: none;
    background: var(--lime); color: var(--ink-on-lime); cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 #8DB824; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.mic-btn svg { width: 21px; height: 21px; }
  button.mic-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #8DB824; }
  button.mic-btn.recording { background: var(--warn); box-shadow: 0 3px 0 #a17f1f; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

  button.cancel-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--panel); color: var(--text-soft); cursor: pointer; display: none; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button.cancel-btn.visible { display: flex; }
  button.cancel-btn:hover { border-color: var(--warn); color: var(--warn); }
  button.cancel-btn svg { width: 16px; height: 16px; }

  button.send {
    flex-shrink: 0; padding: 13px 22px; border-radius: 999px; border: 1.5px solid var(--line);
    background: transparent; color: var(--text); font-family: 'Noto Sans Khmer', sans-serif; font-weight: 600;
    font-size: 0.92rem; cursor: pointer; transition: border-color 0.15s ease;
  }
  button.send:hover { border-color: var(--bright); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px) {
    header { padding: 12px 14px; gap: 6px; }
    .logo { font-size: 0.9rem; }
    .lang-toggle button { padding: 5px 9px; font-size: 0.66rem; }
    .icon-btn { width: 34px; height: 34px; }
    .icon-btn svg { width: 16px; height: 16px; }
    .filters { padding: 10px 14px; }
    main { padding: 18px 14px; gap: 10px; }
    .msg { max-width: 88%; padding: 12px 15px; font-size: 0.94rem; }
    form { padding: 12px 14px 18px; gap: 8px; }
    button.send { padding: 13px 16px; font-size: 0.86rem; }
    button.mic-btn { width: 46px; height: 46px; }
    button.mic-btn svg { width: 19px; height: 19px; }
  }

  @media (max-width: 420px) {
    /* Side clusters get wide enough here that absolute centering can
       collide with them -- fall back to flex order so nothing overlaps. */
    .logo { position: static; transform: none; order: 0; }
    header a.back { order: -1; }
    .header-actions { order: 1; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back" aria-label="ត្រឡប់ក្រោយ">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <div class="logo">Smart<span>Kasekor</span></div>
  <div class="header-actions">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="lang-km" class="active">KM</button>
      <button type="button" id="lang-en">EN</button>
    </div>
    <button type="button" class="icon-btn" id="theme-toggle" title="Toggle theme"></button>
    <button type="button" class="icon-btn" id="sound-toggle" title="Mute"></button>
  </div>
</header>

<div class="filters">
  <button class="filter-chip active khmer" data-category="" data-km="ទាំងអស់" data-en="All">ទាំងអស់</button>
  <button class="filter-chip khmer" data-category="crop" data-km="ដំណាំ" data-en="Crop">ដំណាំ</button>
  <button class="filter-chip khmer" data-category="livestock" data-km="សត្វចិញ្ចឹម" data-en="Livestock">សត្វចិញ្ចឹម</button>
  <button class="filter-chip khmer" data-category="market" data-km="ទីផ្សារ" data-en="Market">ទីផ្សារ</button>
</div>

<main id="messages">
  <div class="welcome" id="welcome">
    <div class="khmer" id="welcome-title">សួស្តី! សួរអ្វីមួយអំពីកសិកម្មរបស់អ្នក</div>
    <div class="sub" id="welcome-sub">សួរដោយសំឡេង ឬអក្សរ — ដំណាំ សត្វចិញ្ចឹម សត្វល្អិត ឬតម្លៃទីផ្សារ។</div>
  </div>
</main>

<form id="chat-form">
  <input type="text" id="question-input" placeholder="វាយសំណួររបស់អ្នក..." autocomplete="off" />
  <button type="button" class="cancel-btn" id="cancel-btn" title="Cancel recording" aria-label="Cancel recording">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button type="button" class="mic-btn" id="mic-btn" title="Ask by voice"></button>
  <button type="submit" class="send khmer" id="send-btn">ផ្ញើ</button>
</form>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  const ICON_VOLUME = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
  const ICON_MUTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
  const ICON_MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
  const ICON_STOP = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
  const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
  const ICON_SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
  const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  const welcomeTitle = document.getElementById('welcome-title');
  const welcomeSub = document.getElementById('welcome-sub');
  const sendBtn = document.getElementById('send-btn');
  const chips = document.querySelectorAll('.filter-chip');
  const soundToggle = document.getElementById('sound-toggle');
  const themeToggle = document.getElementById('theme-toggle');
  const langKm = document.getElementById('lang-km');
  const langEn = document.getElementById('lang-en');

  let activeCategory = "";
  let soundEnabled = true;
  let currentAudio = null;
  let language = "km"; // "km" | "en"

  const COPY = {
    km: {
      placeholder: "វាយសំណួររបស់អ្នក...",
      send: "ផ្ញើ",
      welcomeTitle: "សួស្តី! សួរអ្វីមួយអំពីកសិកម្មរបស់អ្នក",
      welcomeSub: "សួរដោយសំឡេង ឬអក្សរ — ដំណាំ សត្វចិញ្ចឹម សត្វល្អិត ឬតម្លៃទីផ្សារ។",
      mic: "សួរដោយសំឡេង",
    },
    en: {
      placeholder: "Type your question...",
      send: "Send",
      welcomeTitle: "Hi! Ask anything about your farm",
      welcomeSub: "Ask by voice or text — crops, livestock, pests, or market prices.",
      mic: "Ask by voice",
    },
  };

  function setLanguage(lang) {
    language = lang;
    langKm.classList.toggle('active', lang === 'km');
    langEn.classList.toggle('active', lang === 'en');
    input.placeholder = COPY[lang].placeholder;
    sendBtn.textContent = COPY[lang].send;
    if (welcome) {
      welcomeTitle.textContent = COPY[lang].welcomeTitle;
      welcomeSub.textContent = COPY[lang].welcomeSub;
    }
    micBtn.title = COPY[lang].mic;

    // Filter chip labels flip between Khmer and English too.
    chips.forEach(chip => {
      chip.textContent = lang === 'en' ? chip.dataset.en : chip.dataset.km;
    });
  }

  langKm.addEventListener('click', () => setLanguage('km'));
  langEn.addEventListener('click', () => setLanguage('en'));

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
    });
  });

  soundToggle.innerHTML = ICON_VOLUME;
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.innerHTML = soundEnabled ? ICON_VOLUME : ICON_MUTE;
    soundToggle.title = soundEnabled ? 'Mute' : 'Unmute';
    soundToggle.classList.toggle('muted', !soundEnabled);
    if (!soundEnabled && currentAudio) currentAudio.pause();
  });

  // ---------- Theme toggle ----------
  const THEME_KEY = 'smartkasekor-theme';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.innerHTML = theme === 'light' ? ICON_MOON : ICON_SUN;
    themeToggle.title = theme === 'light' ? 'Dark mode' : 'Light mode';
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

  function stripMarkdown(text) {
    return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
  }

  async function fetchTTSAudio(text) {
    const res = await fetch(`${API_BASE}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, language }),
    });
    if (!res.ok) throw new Error(`TTS request failed: ${res.status}`);
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }

  async function playMessageAudio(text, speakerBtn) {
    if (!soundEnabled) return;

    if (speakerBtn.classList.contains('speaking')) {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      speakerBtn.classList.remove('speaking');
      speakerBtn.innerHTML = ICON_VOLUME;
      return;
    }

    try {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      document.querySelectorAll('.speaker-btn.speaking').forEach(b => { b.classList.remove('speaking'); b.innerHTML = ICON_VOLUME; });

      speakerBtn.classList.add('loading');
      const audioUrl = await fetchTTSAudio(text);
      speakerBtn.classList.remove('loading');

      currentAudio = new Audio(audioUrl);
      speakerBtn.classList.add('speaking');
      speakerBtn.innerHTML = ICON_STOP;

      currentAudio.addEventListener('ended', () => { speakerBtn.classList.remove('speaking'); speakerBtn.innerHTML = ICON_VOLUME; });
      currentAudio.addEventListener('error', () => { speakerBtn.classList.remove('speaking'); speakerBtn.innerHTML = ICON_VOLUME; });

      await currentAudio.play().catch(() => { speakerBtn.classList.remove('speaking'); speakerBtn.innerHTML = ICON_VOLUME; });
    } catch (err) {
      speakerBtn.classList.remove('loading', 'speaking');
      speakerBtn.innerHTML = ICON_VOLUME;
      console.error('TTS playback failed:', err);
    }
  }

  function addMessage(text, sender, opts = {}) {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = `msg ${sender}` + (opts.lowConfidence ? ' low-confidence' : '');

    const cleanText = stripMarkdown(text);
    const textSpan = document.createElement('span');
    textSpan.textContent = cleanText;
    div.appendChild(textSpan);

    const isRealBotAnswer = sender === 'bot';
    let speakerBtn = null;
    if (isRealBotAnswer) {
      speakerBtn = document.createElement('button');
      speakerBtn.type = 'button';
      speakerBtn.className = 'speaker-btn';
      speakerBtn.title = 'Play audio';
      speakerBtn.innerHTML = ICON_VOLUME;
      speakerBtn.addEventListener('click', () => playMessageAudio(cleanText, speakerBtn));
      div.appendChild(speakerBtn);
    }

    const isOfflineCache = opts.sources && opts.sources.length === 1 && opts.sources[0] === '(offline cache)';
    if (isOfflineCache) {
      const note = document.createElement('div');
      note.className = 'offline-note';
      const noteText = language === 'en'
        ? 'Answer from saved data (offline) — please confirm again once you have internet.'
        : 'ចម្លើយពីព័ត៌មានរក្សាទុក (គ្មានអ៊ីនធឺណិត) — សូមផ្ទៀងផ្ទាត់ពេលមានអ៊ីនធឺណិតឡើងវិញ';
      note.innerHTML = ICON_INFO + `<span>${noteText}</span>`;
      div.appendChild(note);
    } else if (opts.sources && opts.sources.length > 0) {
      const src = document.createElement('div');
      src.className = 'sources';
      const label = language === 'en' ? 'Sources: ' : 'ប្រភព៖ ';
      src.textContent = label + opts.sources.join(', ');
      div.appendChild(src);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    if (isRealBotAnswer && speakerBtn) playMessageAudio(cleanText, speakerBtn);
    return div;
  }

  function addTypingIndicator() {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingMsg = addTypingIndicator();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: question,
          category: activeCategory || null,
          language: language,
        }),
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      addMessage(data.answer, 'bot', { lowConfidence: data.low_confidence, sources: data.sources });
    } catch (err) {
      typingMsg.remove();
      const msg = language === 'en'
        ? `Couldn't reach the server — is the SmartKasekor backend running at ${API_BASE}? (${err.message})`
        : `មិនអាចភ្ជាប់ទៅម៉ាស៊ីនមេបានទេ — តើ SmartKasekor backend កំពុងដំណើរការនៅ ${API_BASE} ដែរឬទេ? (${err.message})`;
      addMessage(msg, 'bot low-confidence');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  const micBtn = document.getElementById('mic-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  micBtn.innerHTML = ICON_MIC;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let recordingCancelled = false;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
      audioChunks = [];

      mediaRecorder.addEventListener('dataavailable', (e) => { if (e.data.size > 0) audioChunks.push(e.data); });

      mediaRecorder.addEventListener('stop', () => {
        stream.getTracks().forEach(track => track.stop());
        if (recordingCancelled) { recordingCancelled = false; return; }
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        sendVoiceMessage(audioBlob);
      });

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.innerHTML = ICON_STOP;
      micBtn.title = language === 'en' ? 'Stop and send' : 'បញ្ឈប់ ហើយផ្ញើ';
      cancelBtn.classList.add('visible');
    } catch (err) {
      const msg = language === 'en' ? `Couldn't access the microphone: ${err.message}` : `មិនអាចប្រើមីក្រូបានទេ: ${err.message}`;
      addMessage(msg, 'bot low-confidence');
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = ICON_MIC;
      micBtn.title = COPY[language].mic;
      cancelBtn.classList.remove('visible');
    }
  }

  cancelBtn.addEventListener('click', () => { if (isRecording) { recordingCancelled = true; stopRecording(); } });
  micBtn.addEventListener('click', () => { isRecording ? stopRecording() : startRecording(); });

  async function sendVoiceMessage(audioBlob) {
    const typingMsg = addTypingIndicator();
    sendBtn.disabled = true;
    micBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');
      formData.append('language', language);
      if (activeCategory) formData.append('category', activeCategory);

      const res = await fetch(`${API_BASE}/chat/voice`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      typingMsg.remove();
      if (data.transcript) addMessage(data.transcript, 'user');
      addMessage(data.answer, 'bot', { lowConfidence: data.low_confidence, sources: data.sources });
    } catch (err) {
      typingMsg.remove();
      const msg = language === 'en' ? `Voice error — is the backend running? (${err.message})` : `បញ្ហាសំឡេង — តើ backend កំពុងដំណើរការដែរឬទេ? (${err.message})`;
      addMessage(msg, 'bot low-confidence');
    } finally {
      sendBtn.disabled = false;
      micBtn.disabled = false;
    }
  }

  setLanguage('km');
</script>

</body>
